<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تطبيق تتبع الخطوات والنشاط البدني</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="main-wrapper">
<div class="logos-header">
<img src="logo1.png" alt="إدارة مدينة الملك عبدالعزيز العسكرية" class="header-logo">
<img src="logo2.png" alt="برنامج المدن الصحية" class="header-logo">
</div>

<div id="welcomePage" class="screen-card">
<h2><i class="fa-solid fa-user-check"></i> مرحباً بك</h2>
<p>يرجى إدخال بياناتك لبدء تتبع نشاطك البدني</p>

<form id="userForm">
<div class="input-group">
<label>الاسم الكامل</label>
<input type="text" id="userName" placeholder="أدخل اسمك" required>
</div>

<div class="input-group">
<label>العمر</label>
<input type="number" id="userAge" placeholder="أدخل عمرك" min="5" max="120" required>
</div>

<div class="input-group">
<label>الجنس</label>
<select id="userGender" required>
<option value="" disabled selected>اختر الجنس</option>
<option value="ذكر">ذكر</option>
<option value="أنثى">أنثى</option>
</select>
</div>

<button type="submit" class="btn btn-primary btn-full">دخول وابدأ التتبع</button>
</form>
</div>

<div id="appContainer" class="screen-card hidden">
<header>
<h1><i class="fa-solid fa-person-walking"></i> متعقب النشاط البدني</h1>
<p id="welcomeMessage">تتبع خطواتك وسعراتك الحرارية بسهولة</p>
<button id="editProfileBtn" class="btn-small"><i class="fa-solid fa-user-pen"></i> تعديل البيانات</button>
</header>

<main>
<div class="card counter-card">
<h2>عدد الخطوات</h2>
<div class="step-display" id="stepCount">0</div>
<p class="goal">الهدف اليومي: 10,000 خطوة</p>
</div>

<div class="stats-grid">
<div class="card stat-item">
<i class="fa-solid fa-fire icon-fire"></i>
<span class="stat-value" id="calories">0</span>
<span class="stat-label">سعرة حرارية</span>
</div>
<div class="card stat-item">
<i class="fa-solid fa-route icon-route"></i>
<span class="stat-value" id="distance">0</span>
<span class="stat-label">كيلومتر</span>
</div>
</div>

<div class="controls">
<button id="startBtn" class="btn btn-primary"><i class="fa-solid fa-play"></i> بدء التتبع</button>
<button id="resetBtn" class="btn btn-secondary"><i class="fa-solid fa-rotate-right"></i> إعادة ضبط</button>
</div>
</main>
</div>

<footer class="app-footer">
Made by Rakan Alenzi
</footer>
</div>

<script src="script.js"></script>
</body>
</html>
