<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامج المدن الصحية - متتبع الخطوات</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logos">
                <img src="city-logo.png" alt="شعار المدينة العسكرية" onerror="this.style.display='none'">
                <img src="healthy-logo.png" alt="شعار المدن الصحية" onerror="this.style.display='none'">
            </div>
            <h1>برنامج المدن الصحية</h1>
            <p class="subtitle">مدينة الملك عبدالعزيز العسكرية بتبوك</p>
        </header>

        <div class="card" id="userCard">
            <h2><i class="fa-solid fa-user-plus"></i> تسجيل البيانات</h2>
            <br>
            <form id="userForm">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" id="userName" placeholder="أدخل اسمك الكريم" required>
                </div>
                
                <div class="form-group">
                    <label>العمر</label>
                    <input type="number" id="userAge" placeholder="أدخل عمرك" required>
                </div>

                <div class="form-group">
                    <label>الجنس</label>
                    <select id="userGender" required>
                        <option value="ذكر">ذكر</option>
                        <option value="أنثى">أنثى</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>هل أنت من سكان مدينة الملك عبدالعزيز العسكرية؟</label>
                    <select id="userResident" required>
                        <option value="نعم">نعم</option>
                        <option value="لا">لا (زائر)</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">دخول لبدء التتبع 🚀</button>
            </form>
        </div>

        <div class="card hidden" id="trackerCard">
            <div class="user-welcome">
                <h3 id="welcomeMsg">مرحباً بك</h3>
                <button id="editUserBtn" class="btn-small"><i class="fa-solid fa-pen"></i> تعديل</button>
            </div>

            <div class="counter-box">
                <span class="step-label">عدد الخطوات</span>
                <span id="stepCount" class="step-number">0</span>
            </div>

            <div class="stats-grid">
                <div class="stat-item">
                    <i class="fa-solid fa-fire" style="color:#e74c3c;"></i>
                    <span id="calories">0</span>
                    <small>سعرة حرارية</small>
                </div>
                <div class="stat-item">
                    <i class="fa-solid fa-route" style="color:#3498db;"></i>
                    <span id="distance">0.00</span>
                    <small>كم</small>
                </div>
            </div>

            <div class="controls">
                <button id="startBtn" class="btn btn-success"><i class="fa-solid fa-play"></i> بدء التتبع</button>
                <button id="resetBtn" class="btn btn-warning"><i class="fa-solid fa-rotate-left"></i> إعادة</button>
                <button id="endBtn" class="btn btn-danger"><i class="fa-solid fa-flag-checkered"></i> إنهاء الرحلة</button>
            </div>
        </div>

        <footer>
            <p>تطبيق متتبع الخطوات والنشاط البدني</p>
            <p><small>إعداد وتطوير: راكان العنزي © 2026</small></p>
        </footer>
    </div>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script src="script.js"></script>
</body>
</html>
